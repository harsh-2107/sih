name: sih-project

services:
  # ─────────────────────────────────────────────────────────────
  # PostgreSQL — shared database
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: sih_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sih_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sih_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sih-network

  # ─────────────────────────────────────────────────────────────
  # Express backend — auth, session, REST API
  # ─────────────────────────────────────────────────────────────
  backend:
    container_name: sih_backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-5000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/sih_db}
      POSTGRES_DB: ${POSTGRES_DB:-sih_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SESSION_SECRET: ${SESSION_SECRET:-super-secret-session-key-change-me}
      NODE_ENV: ${NODE_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
      PROCESSING_API_URL: ${PROCESSING_API_URL:-http://processing:8000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sih-network

  # ─────────────────────────────────────────────────────────────
  # Next.js frontend
  # ─────────────────────────────────────────────────────────────
  frontend:
    container_name: sih_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      backend:
        condition: service_started
    networks:
      - sih-network

  # ─────────────────────────────────────────────────────────────
  # Neo4j — ML profile optional service
  # ─────────────────────────────────────────────────────────────
  neo4j:
    profiles:
      - ml
    image: neo4j:5-community
    container_name: sih_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_password_change_me}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - sih-network

  # ─────────────────────────────────────────────────────────────
  # FastAPI processing — ML profile optional service
  # ─────────────────────────────────────────────────────────────
  processing:
    profiles:
      - ml
    container_name: sih_processing
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/sih_db}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_password_change_me}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-llama3.1:8b}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      EMBED_DEVICE: ${EMBED_DEVICE:-cpu}
      MERGE_THRESHOLD: ${MERGE_THRESHOLD:-0.70}
      REVIEW_THRESHOLD: ${REVIEW_THRESHOLD:-0.60}
      HAC_LINKAGE: ${HAC_LINKAGE:-average}
      AGENT1_BASE_URL: http://localhost:8000
      NL_LLM_PROVIDER: ${NL_LLM_PROVIDER:-ollama}
      NL_LLM_BASE_URL: ${NL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      NL_LLM_MODEL_NAME: ${NL_LLM_MODEL_NAME:-llama3.1:8b}
      NL_LLM_TEMPERATURE: ${NL_LLM_TEMPERATURE:-0.1}
      NL_LLM_MAX_TOKENS: ${NL_LLM_MAX_TOKENS:-1024}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sih-network

networks:
  sih-network:
    driver: bridge
