services:
  postgres:
    image: postgres:15-alpine
    container_name: sih_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sih_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sih_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih_backend
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      PORT: ${PORT:-5000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/sih_db}
      POSTGRES_DB: ${POSTGRES_DB:-sih_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SESSION_SECRET: ${SESSION_SECRET:-super-secret-session-key-change-me}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
