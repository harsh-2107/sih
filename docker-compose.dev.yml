# docker-compose.dev.yml — development overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Provides:
#   - Development configuration for postgres, backend, and frontend ONLY by default
#   - Bind-mount hot-reload for backend and frontend
#   - Named volumes for container node_modules to keep host and container dependencies clean
#   - Neo4j and processing belong to the optional "ml" profile

services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    environment:
      WATCHPACK_POLLING: "true"
    command: npm run dev

  neo4j:
    profiles:
      - ml
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data_dev:/data
      - neo4j_logs_dev:/logs

  processing:
    profiles:
      - ml
    build:
      context: ./processing
      dockerfile: Dockerfile
      target: development
    ports:
      - "${PROCESSING_PORT:-8000}:8000"
    volumes:
      - ./processing:/app

volumes:
  postgres_data_dev:
  backend_node_modules:
  frontend_node_modules:
  frontend_next_cache:
  neo4j_data_dev:
  neo4j_logs_dev:
